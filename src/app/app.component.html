<main>
  <app-world />

  <app-layer layer="about" kicker="Book & Quill" heading="About the player">
    <app-about />
  </app-layer>

  <app-layer
    layer="experience"
    kicker="Quest Log"
    heading="Experience"
    lead="Two internships modernizing a production ticketing system: first the frontend, then the backend."
  >
    <app-quests />
  </app-layer>

  <app-layer
    layer="projects"
    kicker="Builds"
    heading="Projects"
    lead="From IoT hardware to LLM-powered apps, including two award-winning hackathon builds."
  >
    <app-builds />
  </app-layer>

  <app-layer
    layer="awards"
    kicker="Advancements"
    heading="Awards & leadership"
    lead="Three podium finishes at national and regional hackathons, and a robotics club built from scratch."
  >
    <app-advancements />
  </app-layer>

  <app-layer layer="skills" kicker="Inventory" heading="Skills">
    <app-inventory />
  </app-layer>

  <app-layer
    layer="contact"
    kicker="Multiplayer"
    heading="Contact"
    lead="Looking for software engineering internships, junior roles and graduate study. The server is always open."
  >
    <app-multiplayer />
  </app-layer>

  <app-layer layer="bedrock">
    <footer class="bedrock">
      <p class="bedrock__title sh">You hit bedrock.</p>
      <p class="sh">Thanks for digging all the way down.</p>
      <button type="button" class="mc-btn" (click)="respawn()">Respawn at surface</button>
      <p class="bedrock__copy sh">© {{ year }} {{ profile.name }} · Every texture on this page is generated in code.</p>
    </footer>
  </app-layer>
</main>

<app-hud />
